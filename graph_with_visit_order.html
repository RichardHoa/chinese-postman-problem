                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#1f78b4", "id": "Location 21", "label": "Location 21 (4, 12)", "shape": "dot"}, {"color": "#1f78b4", "id": "Location 29", "label": "Location 29 (7, 14)", "shape": "dot"}, {"color": "#1f78b4", "id": "Location 17", "label": "Location 17 (15)", "shape": "dot"}, {"color": "#1f78b4", "id": "Location 49", "label": "Location 49 (3)", "shape": "dot"}, {"color": "#1f78b4", "id": "Location 24", "label": "Location 24 (6, 8)", "shape": "dot"}, {"color": "#1f78b4", "id": "Location 16", "label": "Location 16 (10, 16)", "shape": "dot"}, {"color": "#1f78b4", "id": "Location 27", "label": "Location 27 (5, 13)", "shape": "dot"}, {"color": "#1f78b4", "id": "Location 50", "label": "Location 50 (2)", "shape": "dot"}, {"color": "#1f78b4", "id": "Location 7", "label": "Location 7 (9, 11)", "shape": "dot"}, {"color": "red", "id": "Location 44", "label": "Location 44 (1, 17)", "shape": "dot"}]);

                  nodeColors = {};

            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  
                  // if this network requires displaying the configure window,

                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;
