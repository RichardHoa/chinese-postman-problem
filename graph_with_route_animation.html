        <script type="text/javascript">

              // initialize global variables.

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#1f78b4", "id": "Location 16", "label": "Location 16", "shape": "dot"}, {"color": "#1f78b4", "id": "Location 47", "label": "Location 47", "shape": "dot"}, {"color": "#1f78b4", "id": "Location 30", "label": "Location 30", "shape": "dot"}, {"color": "#1f78b4", "id": "Location 21", "label": "Location 21", "shape": "dot"}, {"color": "#1f78b4", "id": "Location 29", "label": "Location 29", "shape": "dot"}, {"color": "#1f78b4", "id": "Location 42", "label": "Location 42", "shape": "dot"}, {"color": "#1f78b4", "id": "Location 40", "label": "Location 40", "shape": "dot"}, {"color": "#1f78b4", "id": "Location 1", "label": "Location 1", "shape": "dot"}, {"color": "#1f78b4", "id": "Location 26", "label": "Location 26", "shape": "dot"}, {"color": "#1f78b4", "id": "Location 18", "label": "Location 18", "shape": "dot"}]);
                  edges = new vis.DataSet([{"arrows": "to", "color": "#ccc", "from": "Location 16", "label": "5.3", "to": "Location 42"}, {"arrows": "to", "color": "#ccc", "from": "Location 16", "label": "5.3", "to": "Location 42"}, {"arrows": "to", "color": "#ccc", "from": "Location 16", "label": "8.2", "to": "Location 29"}, {"arrows": "to", "color": "#ccc", "from": "Location 16", "label": "9.0", "to": "Location 30"}, {"arrows": "to", "color": "#ccc", "from": "Location 47", "label": "6.1", "to": "Location 26"}, {"arrows": "to", "color": "#ccc", "from": "Location 47", "label": "9.0", "to": "Location 21"}, {"arrows": "to", "color": "#ccc", "from": "Location 47", "label": "6.5", "to": "Location 18"}, {"arrows": "to", "color": "#ccc", "from": "Location 47", "label": "6.5", "to": "Location 18"}, {"arrows": "to", "color": "#ccc", "from": "Location 30", "label": "6.8", "to": "Location 21"}, {"arrows": "to", "color": "#ccc", "from": "Location 30", "label": "6.8", "to": "Location 21"}, {"arrows": "to", "color": "#ccc", "from": "Location 30", "label": "4.2", "to": "Location 42"}, {"arrows": "to", "color": "#ccc", "from": "Location 21", "label": "4.9", "to": "Location 1"}, {"arrows": "to", "color": "#ccc", "from": "Location 29", "label": "8.4", "to": "Location 40"}, {"arrows": "to", "color": "#ccc", "from": "Location 42", "label": "8.7", "to": "Location 40"}, {"arrows": "to", "color": "#ccc", "from": "Location 1", "label": "5.5", "to": "Location 18"}, {"arrows": "to", "color": "#ccc", "from": "Location 26", "label": "7.3", "to": "Location 18"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": true
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": false,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
    
        <script>
        let route = ['Location 26', 'Location 18', 'Location 47', 'Location 18', 'Location 1', 'Location 21', 'Location 30', 'Location 42', 'Location 40', 'Location 29', 'Location 16', 'Location 42', 'Location 16', 'Location 30', 'Location 21', 'Location 47', 'Location 26'];
        let currentStep = 0;
        let edges = network.body.data.edges;
        let nodes = network.body.data.nodes;

        function highlightStep() {
            if (currentStep >= route.length) return;

            let current = route[currentStep];
            nodes.update({id: current, color: 'red'});

            if (currentStep > 0) {
                let prev = route[currentStep - 1];
                edges.forEach(edge => {
                    if (edge.from === prev && edge.to === current) {
                        edge.color = 'orange';
                        edge.width = 4;
                    }
                });
            }

            updateRouteLabel();
            currentStep++;
            setTimeout(highlightStep, 1000);
        }

        function updateRouteLabel() {
            let path = route.slice(0, currentStep + 1).join(" → ");
            document.getElementById("route-info").innerText = "Current path: " + path;
        }

        let routeLabel = document.createElement("div");
        routeLabel.id = "route-info";
        routeLabel.style.position = "fixed";
        routeLabel.style.top = "10px";
        routeLabel.style.left = "10px";
        routeLabel.style.padding = "10px";
        routeLabel.style.background = "white";
        routeLabel.style.border = "1px solid #ccc";
        routeLabel.style.fontFamily = "monospace";
        routeLabel.style.zIndex = "1000";
        document.body.appendChild(routeLabel);

        highlightStep();
        </script>
